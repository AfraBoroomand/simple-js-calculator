<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>
    <link rel="stylesheet" href="assets/styles/style.css" />
  </head>
  <body>
    <main class="calculator">
      <img src="assets/img/calculator.webp" alt="calculator" class="logo" />
      <h1>ماشین حساب تعاملی</h1>
      <p class="description">
        محاسبه سریع و پردازش گام‌به‌گام عملیات پایه با ساختاری ساده و شفاف
        <button class="start-btn" onclick="startcalculator()">
          شروع محاسبه
        </button>
      </p>
      <div class="info">
        نحوه تعامل با سیستم:
        <br />
        ورود مقدار اولیه، تعیین عملگر ریاضی و درج مقدار نهایی برای دریافت خروجی.
      </div>
    </main>
    <script src="assets/scripts/script.js"></script>
  </body>
</html>
